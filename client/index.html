<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23ea580c'/><path d='M30 65 Q50 25 70 65 Z' fill='%23ffffff'/><circle cx='50' cy='32' r='6' fill='%23fef08a'/><path d='M25 68 L75 68 L70 74 L30 74 Z' fill='%23ffffff'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TastyBite | Good Food, Just a Bite Away</title>
    <meta name="description" content="TastyBite - Order mouth-watering dishes from top local restaurants. Enjoy smart recommendations, real-time tracking, and collaborative group ordering." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('tastybite_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 font-sans antialiased selection:bg-orange-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
